name: Update Funnel documentation

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-funnel-docs
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare Funnel docs update
    runs-on: ubuntu-latest
    steps:
      - name: Check out CALYPR docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Funnel develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calypr/funnel
          ref: develop
          path: .funnel-upstream
          persist-credentials: false

      - name: Check Funnel revision
        id: revision
        run: |
          revision=$(git -C .funnel-upstream rev-parse HEAD)
          previous=$(python3 -c 'import json; print(json.load(open("docs/tools/funnel/.funnel-docs.json"))["revision"])')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if [ "$revision" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.revision.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Test sync behavior
        if: steps.revision.outputs.changed == 'true'
        run: python -m unittest discover -s tests -v

      - name: Sync Funnel documentation
        if: steps.revision.outputs.changed == 'true'
        run: python scripts/sync_funnel_docs.py .funnel-upstream --revision "${{ steps.revision.outputs.revision }}"

      - name: Install website dependencies
        if: steps.revision.outputs.changed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Build the website
        if: steps.revision.outputs.changed == 'true'
        run: zensical build --clean

      - name: Create or update pull request
        if: steps.revision.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/sync-funnel-docs
          commit-message: 'docs: sync Funnel develop documentation'
          title: 'docs: sync Funnel develop documentation'
          body: |
            Update the CALYPR site from [Funnel develop](https://github.com/calypr/funnel/tree/${{ steps.revision.outputs.revision }}) at `${{ steps.revision.outputs.revision }}`.

            Review the generated content and navigation before merging. This PR was prepared and built by the scheduled documentation sync.
          delete-branch: true
